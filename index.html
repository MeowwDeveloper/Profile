<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #9AA6B2;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            background-color: #bcccdcaa;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 300px;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: solid 4px #9AA6B2;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .profile-name {
            font-size: 24px;
            color: #f8fafcd2;
            margin-bottom: 10px;
        }

        .profile-title {
            font-size: 16px;
            color: #d9eafd95;
            margin-bottom: 20px;
        }

        a.button {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            text-align: center;
            background-color: #9AA6B2;
            color: #D9EAFD;
            text-decoration: none;
            border-radius: 5px;
            border: 2px solid #D9EAFD;
            transition: background-color 0.3s, transform 0.3s;
        }

        a.button:hover {
            background-color: #D9EAFD;
            color: #9AA6B2;
            border-color: #9AA6B2;
            transform: translateY(-2px) translateX(-1px);
        }

        .social-links {
            margin-top: 20px;
        }

        .social-links a {
            margin: 0 10px;
            font-size: 18px;
            color: #D9EAFD;
            text-decoration: none;
        }

        .social-links a:hover {
            color: #9AA6B2;
        }

        /* Responsif untuk layar lebih kecil */
        @media (max-width: 768px) {
            .container {
                width: 90%;
                padding: 20px;
            }

            .profile-img {
                width: 100px;
                height: 100px;
            }

            .profile-name {
                font-size: 20px;
            }

            .profile-title {
                font-size: 14px;
            }

            a.button {
                font-size: 14px;
                padding: 8px 16px;
            }

            .social-links a {
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .container {
                width: 100%;
                padding: 15px;
            }

            .profile-img {
                width: 80px;
                height: 80px;
            }

            .profile-name {
                font-size: 18px;
            }

            .profile-title {
                font-size: 12px;
            }

            a.button {
                font-size: 12px;
                padding: 6px 12px;
            }

            .social-links a {
                font-size: 14px;
                display: block;
                margin: 5px 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="Meoww Developer.jpg" alt="Profile Picture" class="profile-img">
        <div class="profile-name">Meoww Developer</div>
        <div class="profile-title">Novice Programmer</div>
        <a href="https://www.linkedin.com/in/meoww-developer-322a72344" target="_blank" class="button">
            Kunjungi LinkedIn
        </a>
        <div class="social-links">
            <a href="https://www.facebook.com" target="_blank">Facebook</a>
            <a href="https://www.instagram.com/sym_fv_/" target="_blank">Instagram</a>
            <a href="https://github.com/MeowwDeveloper" target="_blank">GitHub</a>
        </div>
    </div>
</body>
</html>
